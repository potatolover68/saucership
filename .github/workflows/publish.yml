name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Publish orphan build branch
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/dist/saucership.cjs"
          test -f "$BUNDLE"
          WORK=$(mktemp -d)
          cp "$BUNDLE" "$WORK/index.js"
          cd "$WORK"
          git init
          git checkout -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "chore: publish bundle"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
